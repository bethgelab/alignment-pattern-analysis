[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "multitasking"
description = "Pipeline for evaluating models on brain alignment"
authors = [
  { name="Matthias Tangemann"},
  { name="Lotta Piefke"},
  { name="Larissa Höfling"},
  { name="Susanne Keller"}
]
readme = "README.md"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
# Core: the pipeline, analysis, plotting and dataset preparation. Model providers
# live in multitasking/models/ and are imported lazily, so each one's heavy
# dependencies are an extra below.
dependencies = [
  "click==8.1.8",
  "coloredlogs==15.0.1",
  "einops==0.8.1",
  "executor==23.2",
  "h5py==3.14.0",
  "hcp_utils==0.1.0",
  "imageio[pyav,ffmpeg]==2.37.0",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "nibabel==5.3.2",
  # hcp_utils imports nilearn without declaring it.
  "nilearn==0.11.1",
  "numpy>=2.2,<2.3",
  "pandas>=2.2",
  "pillow>=11",
  "pot>=0.9.5",
  "pydantic==2.11.4",
  "python-benedict==0.34.1",
  "questionary==2.1.0",
  "scikit-learn>=1.6",
  "scipy>=1.15",
  "seaborn==0.12.2",
  # mmengine imports pkg_resources at runtime, and mmcv builds against the env's
  # setuptools; setuptools 81 removed pkg_resources.
  "setuptools<81",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "tqdm==4.70.1",
]

[project.optional-dependencies]
clip = ["clip @ git+https://github.com/openai/CLIP.git@dcba3cb2e2827b402d2701e7e1c7d9fed8a20ef1"]
timm = ["timm==1.0.15"]
taskonomy = ["visualpriors==0.3.5"]
vggt = ["vggt @ git+https://github.com/facebookresearch/vggt.git@978c1b2ee46432c0759e732857a0ef3205ec798a"]
opt_cwm = ["dacite==1.9.2", "easydict==1.13", "pyyaml", "requests", "timm==1.0.15"]
# mmcv and mmaction2 themselves need a CUDA build against the installed torch and are
# installed with --no-deps after syncing (see README.md); these are their runtime deps.
mmaction2 = [
  "addict",
  "decord>=0.4.1",
  "mmengine==0.10.7",
  "opencv-contrib-python==4.12.0.88",
  "pyyaml",
  "torchextractor==0.3.0",
  "yapf",
]
all = ["multitasking[clip,timm,taskonomy,vggt,opt_cwm,mmaction2]"]


[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pandas-stubs==2.3.0.250703",
  "pre-commit==4.3.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
  "tqdm-stubs==0.2.1",
  "types-pycocotools==2.0.0.20250111",
  "types-pyyaml==6.0.12.20250516",
]


[tool.uv]
# CLIP's setup.py imports pkg_resources, which setuptools 81 removed.
build-constraint-dependencies = ["setuptools<81"]
# vggt declares numpy<2 but runs on numpy 2; this replaces every numpy constraint.
override-dependencies = ["numpy>=2.2,<2.3"]
# vggt and mmengine want opencv-python, mmaction2 opencv-contrib-python; both install
# cv2, so keep them at the same version.
constraint-dependencies = ["opencv-python==4.12.0.88"]


[tool.ruff]
lint.select = ["B", "D", "E", "W", "F", "FIX", "I", "T20"]
lint.ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "E501"]
lint.pydocstyle.convention = "google"
exclude = ["_extern", "multitasking/plot_creation/**", "multitasking/analyses/alignment_pattern.py"]


[tool.mypy]
# tasks/*/launch.py share a basename; map files to modules by path instead.
explicit_package_bases = true
ignore_missing_imports = true
exclude = ["^multitasking/plot_creation/", "^multitasking/analyses/alignment_pattern\\.py$"]

[[tool.mypy.overrides]]
module = "multitasking.models._extern.*"
ignore_errors = true


[tool.setuptools]
packages = ["multitasking"]
