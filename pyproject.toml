[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "multitasking"
description = "Pipeline for evaluating models on brain alignment"
authors = [
  { name="Matthias Tangemann"},
  { name="Lotta Piefke"},
  { name="Larissa Höfling"},
  { name="Susanne Keller"}
]
readme = "README.md"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "click==8.1.8",
  "coloredlogs==15.0.1",
  "dacite==1.9.2",
  "easydict==1.13",
  "einops==0.8.1",
  "executor==23.2",
  "hcp_utils==0.1.0",
  "imageio[pyav,ffmpeg]==2.37.0",
  "ipykernel==6.29.5",
  "nibabel==5.3.2",
  "nilearn==0.11.1",
  "numba==0.61.2",
  "odfpy==1.4.1",
  "POT==0.9.5",
  "pydantic==2.11.4",
  "python-benedict==0.34.1",
  "questionary==2.1.0",
  "seaborn==0.12.2",
  "timm==0.4.12",
  "torch==2.6.0",
  "torchextractor==0.3.0",
  "torchvision==0.21.0",
  "visualpriors==0.3.5",
]


[dependency-groups]
dev = [
  "mypy~=1.17",
  "pandas-stubs==2.3.0.250703",
  "pre-commit~=4.2",
  "pytest~=8.4",
  "pytest-cov~=6.2",
  "ruff~=0.12.7",
  "tqdm-stubs==0.2.1",
  "types-pycocotools==2.0.0.20250111",
  "types-pyyaml==6.0.12.20250516",
]


[tool.ruff]
lint.select = ["B", "D", "E", "W", "F", "FIX", "I", "T20"]
lint.ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "E501"]
lint.pydocstyle.convention = "google"
exclude = ["_extern", "multitasking/plot_creation/**", "multitasking/analyses/alignment_pattern.py"]


[tool.setuptools]
packages = ["multitasking"]


[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}


[tool.setuptools.dynamic.optional-dependencies]
dev = {file = ["requirements-dev.txt"]}
